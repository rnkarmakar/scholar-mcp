name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv pip install arxiv-mcp-server    
      - run: pip install -e .
      - run: python -m scholar_mcp.tools.scholar --help || true
