mcp:
  servers:
    scholar-mcp:
      command: uv
      args:
        - tool            # <─ utility bundled with 'uv'
        - run
        - scholar-mcp     # ← the package's console-script
    arxiv-mcp-server:
      command: uv
      args:
        - tool
        - run
        - arxiv-mcp-server
        - --storage-path
        - ./data/arxiv_papers
